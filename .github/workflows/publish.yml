name: Sync approved content and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: approved-content-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot approved public content
        id: sync
        run: python scripts/sync-approved.py
      - name: Commit approved snapshot to source
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js
          git commit -m 'Snapshot approved article revisions'
          git push origin HEAD:main
      - name: Prepare static website
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          mkdir -p _site
          cp index.html app.js cloud.js style.css data.js .nojekyll _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v5
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site
      - name: Deploy static snapshot
        id: deployment
        if: steps.sync.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
