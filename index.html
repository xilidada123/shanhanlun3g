<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>伤寒论 · 温故</title><link rel="stylesheet" href="style.css"><body><header><div class="brand">温故 <span>伤寒论三级条文</span></div><div class="header-actions"><button id="connect">连接本地题库文件夹</button><button id="downloadData">导出完整题库</button><button id="migrate" hidden>写入旧版校订</button><button id="export">备份学习数据</button> <label class="button">导入备份<input type="file" id="import" accept="application/json" hidden></label></div></header><main><aside><div class="eyebrow">学而时习之</div><h1>读经典，<br>温故知新。</h1><p class="intro">以提要为引，默写原文。<br>每一次回想，都是一次领悟。</p><nav><button id="practice" class="active">✎ 提要默写</button><button id="browse">☷ 条文查看</button></nav><label>所在章节<select id="chapter"><option value="">全部章节</option></select></label><label>条文等级<select id="grade"><option value="">全部等级</option><option value="1">一级</option><option value="2">二级</option><option value="3">三级</option><option value="0">待校对</option></select></label><label>学习状态<select id="status"><option value="">全部条文</option><option value="new">尚未标记</option><option value="review">需要复习</option><option value="known">已经掌握</option><option value="star">已收藏</option></select></label><label>搜索<input id="search" placeholder="提要、原文、条号…"></label><p id="stats" class="small"></p><p class="small">文字由扫描件识别，可能有误。<br>请结合原图校对；校订可直接写回本地题库文件。</p></aside><section><div class="topline"><span id="modeTitle">提要默写</span><span id="counter"></span></div><p id="fileStatus" role="status">校订前请连接当前程序文件夹，保存将写入其中的 data.js。</p><div class="toolbar"><button id="prev">← 上一条</button><button id="random">随机一条</button><button id="next">下一条 →</button></div><article id="card"></article><div id="empty" hidden>暂无符合条件的条文，请调整筛选。</div><footer>温故 · 本地学习版 <span>进度自动保存于当前浏览器 · 建议定期备份</span></footer></section></main><dialog id="editor"><form method="dialog"><div class="edit-header"><h2>对照原图校订</h2><button value="cancel">取消 / 关闭</button></div><div class="edit-layout"><div id="editFields"></div><div id="editScan"></div></div><div class="edit-footer"><p id="editStatus" role="status"></p><div class="actions"><button id="saveEdit" type="button" class="primary">保存到本地题库</button><button id="downloadEdit" type="button">导出本次修改的完整题库</button></div></div></form></dialog><script src="data.js"></script><script src="app.js"></script></body></html>
